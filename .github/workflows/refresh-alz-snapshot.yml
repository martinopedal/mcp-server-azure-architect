name: Refresh ALZ snapshot

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: [self-hosted, personal-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run refresh script
        run: python scripts/refresh_alz_snapshot.py

      - name: Open PR if drift detected
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: |
            chore(alz): refresh vendored snapshot to upstream

            Automated refresh detected upstream drift.
            Manifest commit SHAs bumped.
            Atlas to review query semantics before merge.

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          title: "chore(alz): refresh vendored snapshot to upstream"
          body: |
            ## Automated ALZ snapshot refresh

            This PR was automatically generated by the weekly snapshot refresh workflow.

            ### Changes

            Upstream drift detected. The following sources were updated:
            - Check manifest.json diff for specific commit SHA changes
            - Review MANIFEST.md for human-readable changelog

            ### Review checklist

            - [ ] Verify manifest.json commit SHAs resolve to valid upstream commits
            - [ ] Review KQL query diffs for breaking changes or logic modifications
            - [ ] Confirm citation headers updated correctly in all .kql files
            - [ ] Check file count delta matches expected upstream changes

            **Atlas:** Review query semantics and approve before merge.

            ---

            Workflow: `.github/workflows/refresh-alz-snapshot.yml`
            Cadence: Weekly Monday 06:00 UTC
          branch: chore/alz-snapshot-refresh
          labels: squad,squad:atlas,vendoring
          delete-branch: true
          assignees: martinopedal
