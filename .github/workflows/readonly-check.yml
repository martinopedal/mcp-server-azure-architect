name: Read-Only Enforcement Check

on:
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'scripts/check_readonly.py'
      - '.github/workflows/readonly-check.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**/*.py'
      - 'scripts/check_readonly.py'

permissions:
  contents: read

jobs:
  readonly-check:
    name: Check for mutation methods
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Run read-only enforcement check
        run: |
          python scripts/check_readonly.py src/mcp_server_azure_architect/

      - name: Report success
        if: success()
        run: |
          echo "✓ Read-only enforcement check passed. No mutation methods detected."
