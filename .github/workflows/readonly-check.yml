name: Read-Only Enforcement Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  readonly-check:
    name: Check for mutation methods
    runs-on: [self-hosted, personal-linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Run read-only enforcement check
        run: |
          python scripts/check_readonly.py src/mcp_server_azure_architect/

      - name: Report success
        if: success()
        run: |
          echo "✓ Read-only enforcement check passed. No mutation methods detected."
