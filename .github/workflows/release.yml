name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  verify-version:
    name: Verify tag matches pyproject.toml version
    runs-on: [self-hosted, personal-linux]
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Extract tag
        id: get-tag
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract version from pyproject.toml
        id: get-version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify tag matches version
        run: |
          if [ "${{ steps.get-tag.outputs.tag }}" != "${{ steps.get-version.outputs.version }}" ]; then
            echo "ERROR: Tag v${{ steps.get-tag.outputs.tag }} does not match pyproject.toml version ${{ steps.get-version.outputs.version }}"
            exit 1
          fi
          echo "Tag and version match: ${{ steps.get-version.outputs.version }}"

  test:
    name: Run test suite
    needs: verify-version
    runs-on: [self-hosted, personal-linux]
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      
      - name: Run ruff check
        run: ruff check .
      
      - name: Run mypy
        run: mypy src
      
      - name: Run pytest
        run: pytest -v

  build:
    name: Build distribution packages
    needs: test
    runs-on: [self-hosted, personal-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: [self-hosted, personal-linux]
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-server-azure-architect
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        # Tag pin (not SHA pin) is intentional: pypa/gh-action-pypi-publish pulls its
        # ghcr.io runtime image using the ref it was invoked with as the image tag,
        # and version-tagged images are published while SHA-tagged images are not.
        # See pypa/gh-action-pypi-publish#290 for the upstream behaviour.
        uses: pypa/gh-action-pypi-publish@v1.14.0

  create-release:
    name: Create GitHub Release
    needs: [verify-version, publish-pypi]
    runs-on: [self-hosted, personal-linux]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.verify-version.outputs.version }}"
          # Extract changelog body for this version (Keep a Changelog format: ## [X.Y.Z] - YYYY-MM-DD)
          # Uses an explicit state machine instead of an awk range expression so the start/end heading
          # match on the same line does not collapse the range to zero output.
          awk -v version="$VERSION" '
            !in_section && index($0, "## [" version "] - ") == 1 { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          # Trim trailing blank lines
          sed -i -e :a -e '/^\s*$/d;N;ba' release-notes.md
          # Fail loudly if extraction produced empty notes
          if [ ! -s release-notes.md ]; then
            echo "ERROR: No changelog content extracted for version $VERSION. Check CHANGELOG.md heading format." >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [verify-version, publish-pypi]
    runs-on: [self-hosted, personal-linux]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Sync server.json version with git tag
        run: |
          VERSION="${{ needs.verify-version.outputs.version }}"
          # Defensive: rewrite server.json so a stale repo entry cannot mismatch the tag.
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher CLI
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Authenticate to MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
